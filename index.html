<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direktori Kelompok - Web Programming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f7;
    --ink: #14213d;
    --muted: #5b6785;
    --line: #d3dbe8;
    --card: #ffffff;
    --accent: #2f5bea;
    --hl: #ffd23f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1626; --ink: #e8edf8; --muted: #9aa6c4;
      --line: #26314d; --card: #172038; --accent: #7d9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; line-height: 1.55;
  }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 {
    font-family: "Bricolage Grotesque", Inter, sans-serif;
    font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1.05; margin: 0 0 12px; letter-spacing: -0.02em;
  }
  h1 span { background: linear-gradient(transparent 62%, var(--hl) 62%); padding: 0 4px; }
  .sub { color: var(--muted); margin: 0 0 32px; max-width: 52ch; }
  .tools { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; }
  input[type=search] {
    flex: 1; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  input[type=search]:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .count { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li a {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    color: inherit; text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  li a:hover { border-color: var(--accent); transform: translateX(3px); }
  img {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    background: var(--line); object-fit: cover;
  }
  .name { font-family: "Bricolage Grotesque", Inter, sans-serif; font-weight: 600; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .88rem; }
  .url { margin-left: auto; color: var(--accent); font-size: .88rem; text-align: right; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
  @media (max-width: 520px) {
    li a { flex-wrap: wrap; }
    .url { margin-left: 58px; text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { li a { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Direktori <span>Kelompok</span></h1>
  <p class="sub">Daftar kelompok mata kuliah Web Programming beserta akun GitHub masing-masing. Klik kartu untuk membuka profilnya.</p>

  <div class="tools">
    <input type="search" id="q" placeholder="Cari nama kelompok atau anggota" aria-label="Cari kelompok">
    <span class="count" id="count"></span>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Tidak ada kelompok yang cocok dengan pencarian.</p>

  <footer>Kelompok belum ada di daftar? Kirim nama kelompok dan link GitHub-nya ke koordinator kelas.</footer>
</main>

<script>
  // ===== EDIT DI SINI =====
  // Satu objek = satu kelompok. Ganti contoh di bawah dengan data asli.
  const groups = [
    { name: "Ridwan Pratama", members: "17250686", url: "https://github.com/pratamaridwan" },
    { name: "Muhammad Raditya Nugraha", members: "17250675", url: "https://github.com/username-kelompok2" },
    { name: "Muhamad adnin rivaldo", members: "17250543", url: "https://github.com/muhamadadninrivaldo-cloud" }
  ];
  // ========================

  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const q = document.getElementById("q");

  const username = url => url.replace(/\/+$/, "").split("/").pop();
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function render(items) {
    list.innerHTML = items.map(g => `
      <li>
        <a href="${esc(g.url)}" target="_blank" rel="noopener">
          <img src="https://github.com/${esc(username(g.url))}.png?size=88" alt="" loading="lazy">
          <div>
            <div class="name">${esc(g.name)}</div>
            <div class="meta">${esc(g.members || "")}</div>
          </div>
          <span class="url">github.com/${esc(username(g.url))}</span>
        </a>
      </li>`).join("");
    empty.hidden = items.length > 0;
    count.textContent = items.length + " dari " + groups.length + " kelompok";
  }

  q.addEventListener("input", () => {
    const t = q.value.trim().toLowerCase();
    render(groups.filter(g => (g.name + " " + (g.members || "")).toLowerCase().includes(t)));
  });

  render(groups);
</script>
</body>
</html>
